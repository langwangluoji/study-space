<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-label="UTC、TAI、TT 和 UT1 时标差图"><title>UTC、TAI、TT 和 UT1 时标差图</title><desc>修改下方输入可同步更新几何图形与数值。各图图注说明坐标、方向及比例。</desc><style>.ink{stroke:#334155;fill:#334155}.accent{stroke:#1767b7;fill:#1767b7}.north{stroke:#187a67;fill:#187a67}.east{stroke:#ad5b12;fill:#ad5b12}.muted{stroke:#64748b;fill:#64748b}.grid{stroke:#bbc8d7;fill:none}.faint{stroke:#dde5ec;fill:none}.body{stroke:#72889c;fill:none}path,line,circle{stroke-width:1.3}path[class]{fill:none!important}text{stroke:none!important;font:15px system-ui,sans-serif}.fill{stroke:none}svg{background:#f8fafc}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="accentArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1767b7"/></marker></defs><text x="35" y="38" class="ink" font-size="17" font-weight="650">时标读数差：以同一瞬间的 UTC 读数为零点</text><text x="220" y="73" class="muted" >单位：秒；横轴按比例</text><path d="M220,90L220,314" class="faint" fill="none" /><text x="220" y="85" class="muted" text-anchor="middle">0</text><path d="M280.625,90L280.625,314" class="faint" fill="none" /><text x="280.625" y="85" class="muted" text-anchor="middle">10</text><path d="M341.25,90L341.25,314" class="faint" fill="none" /><text x="341.25" y="85" class="muted" text-anchor="middle">20</text><path d="M401.875,90L401.875,314" class="faint" fill="none" /><text x="401.875" y="85" class="muted" text-anchor="middle">30</text><path d="M462.5,90L462.5,314" class="faint" fill="none" /><text x="462.5" y="85" class="muted" text-anchor="middle">40</text><path d="M523.125,90L523.125,314" class="faint" fill="none" /><text x="523.125" y="85" class="muted" text-anchor="middle">50</text><path d="M583.75,90L583.75,314" class="faint" fill="none" /><text x="583.75" y="85" class="muted" text-ancho