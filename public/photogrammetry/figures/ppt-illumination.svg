<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 345" role="img" aria-labelledby="t d"><title id="t">离轴照度余弦四次方的三个因子</title><desc id="d">离轴像点距透镜更远，入瞳投影和像面接收角各提供一个余弦，合为余弦四次方。</desc><rect width="900" height="345" rx="18" fill="#f4f8fc"/><g font-family="sans-serif" font-size="20" fill="#173750"><text x="30" y="36">Natural vignetting · 理想自然渐晕</text><path d="M70 190H530" stroke="#92a6b5" stroke-dasharray="7 5"/><path d="M190 80V290" stroke="#16847e" stroke-width="5"/><path d="M480 55V300" stroke="#176f89" stroke-width="4"/><path d="M190 190L480 190M190 190L480 75" stroke="#c57629" stroke-width="3"/><path d="M245 190A55 55 0 0 0 241 170" fill="none" stroke="#c57629" stroke-width="2"/><text x="250" y="178">θ</text><text x="300" y="218">f</text><text x="275" y="115">ℓ = f / cosθ</text><text x="119" y="320">入出瞳重合</text><text x="430" y="330">平直像面</text><text x="560" y="90">距离平方反比：cos²θ</text><text x="560" y="145">瞳的投影面积：cosθ</text><text x="560" y="200">像面斜入射：cosθ</text><text x="560" y="270">E(θ) / E(0) = cos⁴θ</text><circle cx="190" cy="190" r="6" fill="#173750"/></g></svg>
