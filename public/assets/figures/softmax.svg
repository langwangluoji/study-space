<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img"><title>Softmax：分数不是概率，归一化后才是</title><style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#20324a;font-size:18px}.muted{fill:#60738a;font-size:15px}.axis{stroke:#8a9cb0;stroke-width:1.3}.curve{fill:none;stroke:#147cb1;stroke-width:3}.node{fill:#eef7fc;stroke:#147cb1;stroke-width:2}.edge{stroke:#96aec0;stroke-width:1.5}.accent{fill:#b36b0d}</style><rect width="100%" height="100%" fill="#fff"/><text x="28" y="32" font-weight="bold">Softmax：分数不是概率，归一化后才是</text><text x="50" y="82" class="" text-anchor="start">类别分数 a = (−1, 0, 2)ᵀ</text><text x="450" y="82" class="" text-anchor="middle">归一化：pₖ = exp(aₖ) / Σⱼ exp(aⱼ)</text><text x="70" y="156" class="" text-anchor="start">类别 1</text><rect x="170" y="135" width="25.206" height="32" rx="4" fill="#147cb1"/><text x="215.20603968043963" y="157" class="" text-anchor="start">0.0420</text><text x="70" y="214" class="" text-anchor="start">类别 2</text><rect x="170" y="193" width="68.517" height="32" rx="4" fill="#147cb1"/><text x="258.51711963075667" y="215" class="" text-anchor="start">0.1142</text><text x="70" y="272" class="" text-anchor="start">类别 3</text><rect x="170" y="251" width="506.277" height="32" rx="4" fill="#147cb1"/><text x="696.2768406888038" y="273" class="" text-anchor="start">0.8438</text><text x="450" y="340" class="muted" text-anchor="middle">三个概率之和为1；共同平移所有logits不会改变概率。</text></svg>