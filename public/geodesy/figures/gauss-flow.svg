<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">高斯平均引数：正算迭代与反算分量法</title><desc id="desc">正算未达容限则继续；达上限仍未收敛则返回失败并停止。迭代残差与级数截断误差分开检查。</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#24384b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#667b8e"/></marker><marker id="grid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#d5dfe6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#216aa5"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#147d6e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#ad6419"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#b84745"/></marker></defs><rect width="1000" height="620" fill="#f6f9fb"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="28" y="38" fill="#24384b" font-size="25">高斯平均引数：正算迭代与反算分量法</text><rect x="20" y="65" width="470" height="490" rx="12" fill="#fff" stroke="#d5dfe6"/><text x="40" y="96" fill="#24384b" font-size="21">正算：起点、方位角、距离</text><rect x="48" y="125" width="414" height="45" rx="7" fill="#edf4fa" stroke="#d5dfe6"/><text x="61" y="153" fill="#24384b" font-size="17">输入 B₁、L₁、A₁₂、S</text><path d="M255,170 L255,187" fill="none" stroke="#216aa5" stroke-width="2.8" marker-end="url(#blue)"/><rect x="48" y="190" width="414" height="45" rx="7" fill="#edf4fa" stroke="#d5dfe6"/><text x="61" y="218" fill="#24384b" font-size="17">估计中间引数 Bm、Am</text><path d="M255,235 L255,252" fill="none" stroke="#216aa5" stroke-width="2.8" marker-end="url(#blue)"/><rect x="48" y="255" width="414" height="45" rx="7" fill="#edf4fa" stroke="#d5dfe6"/><text x="61" y="283" fill="#24384b" font-size="17">计算 N、t、u 及三组差值</text><path d="M255,300 L255,317" fill="none" stroke="#216aa5" stroke-width="2.8" marker-end="url(#blue)"/><rect x="48" y="320" width="414" height="45" rx="7" fill="#edf4fa" stroke="#d5dfe6"/><text x="61" y="348" fill="#24384b" font-size="17">更新 Bm、Am；检查变化量</text><path d="M255,365 L255,382" fill="none" stroke="#216aa5" stroke-width="2.8" marker-end="url(#blue)"/><rect x="48" y="385" width="414" height="45" rx="7" fill="#edf4fa" stroke="#d5dfe6"/><text x="61" y="413" fill="#24384b" font-size="17">满足容限后求终点与反方位角</text><path d="M255,430 L255,447" fill="none" stroke="#216aa5" stroke-width="2.8" marker-end="url(#blue)"/><rect x="48" y="450" width="414" height="45" rx="7" fill="#e7f4ef" stroke="#d5dfe6"/><text x="61" y="478" fill="#147d6e" font-size="17">正反算闭合 + 独立大地线对比</text><rect x="510" y="65" width="470" height="490" rx="12" fill="#fff" stroke="#d5dfe6"/><text x="530" y="96" fill="#24384b" font-size="21">反算：两个端点</text><rect x="538" y="125" width="414" height="45" rx="7" fill="#edf4fa" stroke="#d5dfe6"/><text x="551" y="153" fill="#24384b" font-size="17">输入 B₁、L₁、B₂、L₂</text><path d="M745,170 L745,187" fill="none" stroke="#216aa5" stroke-width="2.8" marker-end="url(#blue)"/><rect x="538" y="190" width="414" height="45" rx="7" fill="#edf4fa" stroke="#d5dfe6"/><text x="551" y="218" fill="#24384b" font-size="17">经差连续展开；求 Bm、ΔB、ΔL</text><path d="M745,235 L745,252" fill="none" stroke="#216aa5" stroke-width="2.8" marker-end="url(#blue)"/><rect x="538" y="255" width="414" height="45" rx="7" fill="#edf4fa" stroke="#d5dfe6"/><text x="551" y="283" fill="#24384b" font-size="17">先算一阶北东分量 X₀、Y₀</text><path d="M745,300 L745,317" fill="none" stroke="#216aa5" stroke-width="2.8" marker-end="url(#blue)"/><rect x="538" y="320" width="414" height="45" rx="7" fill="#edf4fa" stroke="#d5dfe6"/><text x="551" y="348" fill="#24384b" font-size="17">加入三次改正，得到 X、Y</text><path d="M745,365 L745,382" fill="none" stroke="#216aa5" stroke-width="2.8" marker-end="url(#blue)"/><rect x="538" y="385" width="414" height="45" rx="7" fill="#edf4fa" stroke="#d5dfe6"/><text x="551" y="413" fill="#24384b" font-size="17">atan2(Y,X) 求 Am；hypot 求 S</text><path d="M745,430 L745,447" fill="none" stroke="#216aa5" stroke-width="2.8" marker-end="url(#blue)"/><rect x="538" y="450" width="414" height="45" rx="7" fill="#e7f4ef" stroke="#d5dfe6"/><text x="551" y="478" fill="#147d6e" font-size="17">计算 ΔA，恢复 A₁₂、A₂₁</text><path d="M45,356 L32,356 L32,211 L45,211" fill="none" stroke="#ad6419" stroke-width="2" marker-end="url(#orange)"/><text x="28" y="597" fill="#667b8e" font-size="17">正算未达容限则继续；达上限仍未收敛则返回失败并停止。迭代残差与级数截断误差分开检查。</text></g></svg>
