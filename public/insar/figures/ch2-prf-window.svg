<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430"><rect width="1000" height="430" rx="20" fill="#f1f5f9"/><g font-family="Microsoft YaHei, sans-serif" fill="#173451"><text x="42" y="50" font-size="26">PRF 把两种要求放在同一时间表中</text><text x="42" y="91" font-size="18">距离向：接收窗口放得下；方位向：多普勒频带采得全</text><path d="M80 220H920" stroke="#173451" stroke-width="3"/><g fill="#e48936"><rect x="100" y="128" width="25" height="92"/><rect x="460" y="128" width="25" height="92"/><rect x="820" y="128" width="25" height="92"/></g><g fill="#1c8b8a"><rect x="200" y="160" width="185" height="60"/><rect x="560" y="160" width="185" height="60"/></g><text x="93" y="117" font-size="17">发射</text><text x="240" y="150" font-size="17">近端 → 远端回波</text><text x="150" y="260" font-size="16">PRI = 发射T + 保护 + 完整回波(跨度+T) + 保护</text><path d="M112 275H472" stroke="#173451" stroke-width="2"/><path d="M112 267V283M472 267V283" stroke="#173451" stroke-width="2"/><text x="50" y="328" font-size="19">PRF 提高 → 沿轨采样更密，接收周期更短</text><text x="50" y="370" font-size="19">幅宽增大 → 近远端时间跨度增大，距离窗口更长</text><text x="50" y="407" font-size="16">示意按已知脉冲阶数安排回波；多脉冲可同时在传播途中。</text></g></svg>
