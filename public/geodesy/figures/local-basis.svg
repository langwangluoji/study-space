<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">局部基：上向 → 东向 → 北向 → 投影</title><desc id="desc">箭头表示单位方向，不表示实际长度；ENU 是右手基。</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#24384b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#667b8e"/></marker><marker id="grid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#d5dfe6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#216aa5"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#147d6e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#ad6419"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#b84745"/></marker></defs><rect width="1000" height="620" fill="#f6f9fb"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="28" y="38" fill="#24384b" font-size="25">局部基：上向 → 东向 → 北向 → 投影</text><rect x="20" y="65" width="470" height="490" rx="12" fill="#fff" stroke="#d5dfe6"/><text x="40" y="96" fill="#24384b" font-size="21">① 从法线构造三根单位轴</text><path d="M267,365 L462,423.5" fill="none" stroke="#667b8e" stroke-width="2.8" marker-end="url(#muted)"/><text x="468" y="443.5" fill="#667b8e" font-size="17">X</text><path d="M267,365 L120.75,452.75" fill="none" stroke="#667b8e" stroke-width="2.8" marker-end="url(#muted)"/><text x="95.75" y="472.75" fill="#667b8e" font-size="17">Y</text><path d="M267,365 L267,189.49999999999997" fill="none" stroke="#667b8e" stroke-width="2.8" marker-end="url(#muted)"/><text x="247" y="179.49999999999997" fill="#667b8e" font-size="17">k / Z</text><path d="M324.93149000544463,348.4744695334795 L372.00082563486836,335.0474760294316" fill="none" stroke="#216aa5" stroke-width="2.8" marker-end="url(#blue)"/><text x="382.00082563486836" y="330.0474760294316" fill="#216aa5" font-size="21">eᵤ</text><path d="M324.93149000544463,348.4744695334795 L217.4524525586714,375.87713953379705" fill="none" stroke="#ad6419" stroke-width="2.8" marker-end="url(#orange)"/><text x="197.4524525586714" y="400.87713953379705" fill="#ad6419" font-size="21">eₑ</text><path d="M324.93149000544463,348.4744695334795 L291.9731863791992,250.7531814366889" fill="none" stroke="#147d6e" stroke-width="2.8" marker-end="url(#green)"/><text x="263.9731863791992" y="240.7531814366889" fill="#147d6e" font-size="21">eₙ</text><circle cx="324.93149000544463" cy="348.4744695334795" r="4.5" fill="#216aa5"/><text x="304.93149000544463" y="370.4744695334795" fill="#216aa5" font-size="18">P</text><text x="42" y="485" fill="#667b8e" font-size="18">上向沿法线；东向沿纬圈。</text><text x="42" y="518" fill="#667b8e" font-size="17">示例 B = 35°、L = 25°</text><rect x="510" y="65" width="470" height="490" rx="12" fill="#fff" stroke="#d5dfe6"/><text x="530" y="96" fill="#24384b" font-size="21">② 构造方向，再作点积投影</text><text x="535" y="147" fill="#216aa5" font-size="17">eᵤ = (cos B cos L, cos B sin L, sin B)</text><text x="535" y="214" fill="#ad6419" font-size="21">eₑ = (k × eᵤ) / ‖k × eᵤ‖</text><text x="535" y="281" fill="#147d6e" font-size="21">eₙ = eᵤ × eₑ</text><text x="535" y="348" fill="#24384b" font-size="21">Q = [eₑ  eₙ  eᵤ]</text><text x="535" y="415" fill="#24384b" font-size="21">(E, Nloc, U)ᵀ = Qᵀ Δr</text><text x="535" y="511" fill="#667b8e" font-size="17">极点先选参考经线，再定义东、北。</text><text x="28" y="597" fill="#667b8e" font-size="17">箭头表示单位方向，不表示实际长度；ENU 是右手基。</text></g></svg>
