<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">同名点 → 七参数 → XYZ 改正 → 经纬高改正</title><desc id="desc">点位分布是几何示意；三维求解需检查设计矩阵秩，图上的点数本身不能保证可解。</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#24384b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#667b8e"/></marker><marker id="grid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#d5dfe6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#216aa5"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#147d6e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#ad6419"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#b84745"/></marker></defs><rect width="1000" height="620" fill="#f6f9fb"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="28" y="38" fill="#24384b" font-size="25">同名点 → 七参数 → XYZ 改正 → 经纬高改正</text><rect x="20" y="65" width="470" height="245" rx="12" fill="#fff" stroke="#d5dfe6"/><text x="40" y="96" fill="#24384b" font-size="21">① 同名点：覆盖区域，避免共线</text><circle cx="110" cy="170" r="4.5" fill="#147d6e"/><text x="118" y="162" fill="#147d6e" font-size="18">P1</text><circle cx="235" cy="230" r="4.5" fill="#147d6e"/><text x="243" y="222" fill="#147d6e" font-size="18">P2</text><circle cx="390" cy="150" r="4.5" fill="#147d6e"/><text x="398" y="142" fill="#147d6e" font-size="18">P3</text><circle cx="340" cy="256" r="4.5" fill="#147d6e"/><text x="348" y="248" fill="#147d6e" font-size="18">P4</text><path d="M60,272 L445,272" fill="none" stroke="#b84745" stroke-width="1.7" stroke-dasharray="6 5"/><circle cx="80" cy="272" r="4" fill="#b84745"/><circle cx="230" cy="272" r="4" fill="#b84745"/><circle cx="400" cy="272" r="4" fill="#b84745"/><text x="42" y="296" fill="#667b8e" font-size="17">共线会缺秩；沿线加点仍不可辨识。</text><rect x="510" y="65" width="470" height="245" rx="12" fill="#fff" stroke="#d5dfe6"/><text x="530" y="96" fill="#24384b" font-size="21">② 一点三式，逐点堆叠</text><text x="565" y="136" fill="#216aa5" font-size="23">l₁ = A₁ β</text><text x="565" y="176" fill="#216aa5" font-size="23">l₂ = A₂ β</text><text x="565" y="216" fill="#216aa5" font-size="23">⋮</text><text x="565" y="256" fill="#216aa5" font-size="23">lₙ = Aₙ β</text><text x="775" y="182" fill="#147d6e" font-size="20">3n 行 × 7 列</text><text x="775" y="224" fill="#667b8e" font-size="18">检查秩与残差</text><rect x="20" y="330" width="960" height="225" rx="12" fill="#fff" stroke="#d5dfe6"/><text x="40" y="361" fill="#24384b" font-size="21">③ 从框架参数传播到经纬高</text><rect x="42" y="414" width="200" height="62" rx="8" fill="#edf4fa" stroke="#d5dfe6"/><text x="56" y="452" fill="#216aa5" font-size="19">平移、旋转、尺度</text><rect x="294" y="414" width="160" height="62" rx="8" fill="#edf4fa" stroke="#d5dfe6"/><text x="308" y="452" fill="#216aa5" font-size="19">合成 dXYZ</text><rect x="505" y="414" width="175" height="62" rx="8" fill="#edf4fa" stroke="#d5dfe6"/><text x="519" y="452" fill="#216aa5" font-size="19">投影为 NEU</text><rect x="730" y="414" width="205" height="62" rx="8" fill="#edf4fa" stroke="#d5dfe6"/><text x="744" y="452" fill="#216aa5" font-size="19">除以长度标尺</text><path d="M242,445 L286,445" fill="none" stroke="#147d6e" stroke-width="2.8" marker-end="url(#green)"/><path d="M454,445 L497,445" fill="none" stroke="#147d6e" stroke-width="2.8" marker-end="url(#green)"/><path d="M680,445 L722,445" fill="none" stroke="#147d6e" stroke-width="2.8" marker-end="url(#green)"/><text x="43" y="518" fill="#667b8e" font-size="18">更换椭球时，先扣除椭球参数的空间贡献 K dθ。</text><text x="28" y="597" fill="#667b8e" font-size="17">点位分布是几何示意；三维求解需检查设计矩阵秩，图上的点数本身不能保证可解。</text></g></svg>
