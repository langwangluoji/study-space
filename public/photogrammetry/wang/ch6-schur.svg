<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t"><title id="t">光束法正规方程分块和点未知数消去</title><rect width="960" height="420" rx="20" fill="#f4f8f7"/><g font-family="Arial,sans-serif" font-size="20" fill="#173e42"><text x="30" y="38">One image observation touches one camera and one point.</text><text x="115" y="83">camera c</text><text x="300" y="83">points p</text></g><g stroke="#197d8c" stroke-width="2"><rect x="60" y="100" width="180" height="110" fill="#d3e9e7"/><rect x="240" y="100" width="220" height="110" fill="white"/><rect x="60" y="210" width="180" height="160" fill="white"/><rect x="240" y="210" width="220" height="160" fill="#eef4f3"/><path d="M240 210H295V250H350V290H405V330H460" fill="none" stroke="#df8a35" stroke-width="5"/></g><g font-family="Arial,sans-serif" font-size="22" fill="#173e42" text-anchor="middle"><text x="150" y="163">Ncc</text><text x="350" y="163">Ncp</text><text x="150" y="300">Npc</text><text x="350" y="350">Npp</text><text x="710" y="125">S = Ncc - Ncp Npp^-1 Npc</text><text x="710" y="190">S dc = nc - Ncp Npp^-1 np</text><text x="710" y="255">dp = Npp^-1 (np - Npc dc)</text></g><text x="500" y="325" font-family="Arial,sans-serif" font-size="18" fill="#173e42">Eliminate points, solve cameras, recover points.</text><text x="500" y="355" font-family="Arial,sans-serif" font-size="18" fill="#173e42">Inverse notation means solving a linear system.</text></svg>
