<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">七参数：先表达相对向量，再加目标系中的原点位置</title><desc id="desc">三角形的三条边全部用目标系分量表达；R 的方向为源分量 → 目标分量。</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#24384b"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#667b8e"/></marker><marker id="grid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#d5dfe6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#216aa5"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#147d6e"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#ad6419"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#b84745"/></marker></defs><rect width="1000" height="620" fill="#f6f9fb"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="28" y="38" fill="#24384b" font-size="25">七参数：先表达相对向量，再加目标系中的原点位置</text><rect x="20" y="65" width="960" height="490" rx="12" fill="#fff" stroke="#d5dfe6"/><text x="40" y="96" fill="#24384b" font-size="21">目标系中闭合的三条向量</text><path d="M135,418 L368,310" fill="none" stroke="#ad6419" stroke-width="2.8" marker-end="url(#orange)"/><path d="M368,310 L780,166" fill="none" stroke="#147d6e" stroke-width="2.8" marker-end="url(#green)"/><path d="M135,418 L780,166" fill="none" stroke="#216aa5" stroke-width="2.8" marker-end="url(#blue)"/><circle cx="135" cy="418" r="4.5" fill="#216aa5"/><text x="100" y="445" fill="#216aa5" font-size="18">Oₜ</text><circle cx="368" cy="310" r="4.5" fill="#216aa5"/><text x="348" y="295" fill="#216aa5" font-size="18">Oₛ</text><circle cx="780" cy="166" r="4.5" fill="#216aa5"/><text x="790" y="154" fill="#216aa5" font-size="18">P</text><text x="217" y="392" fill="#ad6419" font-size="25">t</text><text x="485" y="217" fill="#147d6e" font-size="26">s R rₛ</text><text x="409" y="335" fill="#216aa5" font-size="25">rₜ</text><path d="M135,418 L210,418" fill="none" stroke="#667b8e" stroke-width="2.8" marker-end="url(#muted)"/><path d="M135,418 L135,343" fill="none" stroke="#667b8e" stroke-width="2.8" marker-end="url(#muted)"/><path d="M368,310 L438.47694655894315,284.34848925057486" fill="none" stroke="#667b8e" stroke-width="2.8" marker-end="url(#muted)"/><path d="M368,310 L342.34848925057486,239.52305344105687" fill="none" stroke="#667b8e" stroke-width="2.8" marker-end="url(#muted)"/><text x="71" y="490" fill="#24384b" font-size="25">rₜ = t + s R rₛ；s = 1 + μ</text><text x="553" y="490" fill="#ad6419" font-size="20">t：从目标原点指向源原点</text><text x="28" y="597" fill="#667b8e" font-size="17">三角形的三条边全部用目标系分量表达；R 的方向为源分量 → 目标分量。</text></g></svg>
