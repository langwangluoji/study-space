<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="340" viewBox="0 0 1040 340" role="img" aria-labelledby="title desc">
<title id="title">一次二维像点观测的局部雅可比</title><desc id="desc">两行预测导数分别对应x和y，三组彩色列对应本相机摄心、本相机姿态和本物点；其余相机和物点列为零。</desc>
<rect width="1040" height="340" rx="18" fill="#f6f9fc"/>
<g font-family="Microsoft YaHei,Arial,sans-serif" fill="#17324d"><text x="28" y="38" font-size="22" font-weight="700">一个像点 → 两个残差分量 → 三组局部未知</text><text x="95" y="95" font-size="18">其他相机</text><text x="298" y="95" font-size="18">本相机 Cᵢ</text><text x="484" y="95" font-size="18">本相机 ηᵢ</text><text x="680" y="95" font-size="18">本物点 Pⱼ</text><text x="869" y="95" font-size="18">其他物点</text></g>
<g stroke="#94a3b8" stroke-width="1.5"><rect x="93" y="114" width="180" height="108" fill="#e9eef3"/><rect x="273" y="114" width="180" height="108" fill="#d9edfc"/><rect x="453" y="114" width="180" height="108" fill="#e8def2"/><rect x="633" y="114" width="180" height="108" fill="#ffead9"/><rect x="813" y="114" width="180" height="108" fill="#e9eef3"/><path d="M93 168H993"/><path d="M333 114V222M393 114V222M513 114V222M573 114V222M693 114V222M753 114V222"/></g>
<g font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#17324d"><text x="47" y="150">x</text><text x="47" y="202">y</text><text x="180" y="178">0</text><text x="903" y="178">0</text><text x="303" y="151">∂</text><text x="363" y="151">∂</text><text x="423" y="151">∂</text><text x="483" y="151">∂</text><text x="543" y="151">∂</text><text x="603" y="151">∂</text><text x="663" y="151">∂</text><text x="723" y="151">∂</text><text x="783" y="151">∂</text><text x="303" y="205">∂</text><text x="363" y="205">∂</text><text x="423" y="205">∂</text><text x="483" y="205">∂</text><text x="543" y="205">∂</text><text x="603" y="205">∂</text><text x="663" y="205">∂</text><text x="723" y="205">∂</text><text x="783" y="205">∂</text></g>
<g font-family="Microsoft YaHei,Arial,sans-serif" fill="#486782" font-size="18"><text x="113" y="271">物点改动与摄心改动的平移导数互为相反数</text><text x="113" y="304">只把真正出现在该预测中的参数连接起来，稀疏结构由观测关系产生</text></g></svg>
