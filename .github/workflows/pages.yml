name: Build, verify and publish notes
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: notes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: node --test scripts/math-handler-lifecycle.test.mjs
      - run: node --test scripts/reading-targets.test.mjs
      - run: npm run check
      - run: node --test scripts/geodesy-publish.test.mjs scripts/geodesy/model.test.mjs
      - run: node scripts/check-geodesy-content.mjs
      - run: node scripts/check-geodesy-figures.mjs
      - run: node scripts/check-classroom-model.mjs
      - run: npm run check:anatomy
      - run: node scripts/check-optimization.mjs
      - run: node scripts/check-traffic.mjs
      - run: node scripts/verify-materials.mjs
      - run: node scripts/check-remote-content.mjs
      - run: python scripts/verify_remote_sensing.py
      - run: pip install -r requirements-geodesy.txt
      - run: python scripts/verify_geodesy.py
      - run: python scripts/verify_geodesic_computation.py
      - run: python scripts/verify_geodesy_coordinates.py
      - run: python scripts/verify_geodesy_orbit.py
      - run: pip install -r requirements-checks.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python scripts/verify_insar.py
      - run: python scripts/verify_optics.py
      - run: python scripts/test_optics_content.py
      - run: python scripts/test_optics_course.py
      - run: python scripts/verify_optics_course.py
      - run: npm run check:math
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-optics-learning.cjs
      - run: node scripts/check-activity-ui.cjs
      - run: node scripts/check-anatomy-ml-ui.mjs
      - run: node scripts/check-anatomy-integration.mjs
      - run: node scripts/check-folio-ui.mjs
      - run: node scripts/check-geodesy-ui.mjs
      - run: node scripts/check-geodesy-figure-ui.mjs
      - run: node scripts/check-ui.cjs
      - run: node scripts/check-remote-resource-navigation.cjs
      - run: node scripts/check-insar-ui.cjs
      - run: node scripts/check-materials-ui.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: notes-preview
          include-hidden-files: true
          path: |
            docs/.vitepress/dist
            reports
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: notes-preview
          path: build-preview
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build-preview/docs/.vitepress/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
