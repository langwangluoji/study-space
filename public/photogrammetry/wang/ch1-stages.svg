<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440"><rect width="1000" height="440" fill="#f5f7fb"/><g font-family="sans-serif" fill="#183047"><text x="35" y="45" font-size="25">三个阶段的差别：影像载体与几何恢复工具</text><g fill="white" stroke="#819ab4" stroke-width="2"><rect x="35" y="85" width="290" height="255" rx="12"/><rect x="355" y="85" width="290" height="255" rx="12"/><rect x="675" y="85" width="290" height="255" rx="12"/></g><g font-size="22"><text x="55" y="127">模拟 Analog</text><text x="375" y="127">解析 Analytical</text><text x="695" y="127">数字 Digital</text></g><g font-size="19"><text x="55" y="178">资料：胶片像片</text><text x="55" y="218">几何：光学 / 机械模型</text><text x="55" y="258">量测：人工操作</text><text x="375" y="178">资料：仍可为胶片</text><text x="375" y="218">几何：数学模型 + 计算机</text><text x="375" y="258">量测：计算机辅助人工</text><text x="695" y="178">资料：数字 / 数字化影像</text><text x="695" y="218">几何：软件数学模型</text><text x="695" y="258">量测：自动 / 半自动</text></g><text x="40" y="388" font-size="22">共同核心：从影像恢复目标几何关系，再进行识别与量测</text><text x="40" y="423" font-size="17">Digital：数据与处理方式变化；不意味着无需几何、控制或人工检查</text></g></svg>
