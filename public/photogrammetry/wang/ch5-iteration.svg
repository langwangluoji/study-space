<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t"><title id="t">线性化迭代流程</title><rect width="900" height="420" rx="20" fill="#f4f8f7"/><g stroke="#197d8c" fill="white" stroke-width="2"><rect x="25" y="60" width="210" height="85" rx="12"/><rect x="345" y="60" width="210" height="85" rx="12"/><rect x="665" y="60" width="210" height="85" rx="12"/><rect x="665" y="265" width="210" height="85" rx="12"/><rect x="345" y="265" width="210" height="85" rx="12"/><rect x="25" y="265" width="210" height="85" rx="12"/><path d="M235 100H335m-12-8 12 8-12 8M555 100H655m-12-8 12 8-12 8M770 145V255m-8-12 8 12 8-12M665 305H565m12-8-12 8 12 8M345 305H245m12-8-12 8 12 8M130 265V155m-8 12 8-12 8 12" fill="none"/></g><g font-family="Arial,sans-serif" font-size="18" fill="#173e42" text-anchor="middle"><text x="450" y="30">One iteration is a local correction, not a new exact model.</text><text x="130" y="96">Initial estimate theta0</text><text x="130" y="123">C + rotation + points</text><text x="450" y="96">Predict g(theta0)</text><text x="450" y="123">l = observed - predicted</text><text x="770" y="96">Jacobian J</text><text x="770" y="123">local derivatives</text><text x="770" y="300">Solve weighted LS</text><text x="770" y="328">J'WJ delta = J'Wl</text><text x="450" y="300">Update theta</text><text x="450" y="328">theta1 = theta0 + delta</text><text x="130" y="300">Check convergence</text><text x="130" y="328">then re-project</text><text x="450" y="395">Also inspect residuals, rank, geometry, and independent checkpoints.</text></g></svg>
