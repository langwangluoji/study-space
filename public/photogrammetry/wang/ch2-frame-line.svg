<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460"><rect width="1000" height="460" fill="#f5f7fb"/><g font-family="sans-serif" fill="#17314a"><text x="35" y="45" font-size="25">面阵框幅与线阵推扫 · Frame and pushbroom</text><g stroke="#567b98" stroke-width="3" fill="none"><rect x="100" y="320" width="310" height="100"/><path d="M255 125 100 320M255 125 410 320M255 125 100 420M255 125 410 420"/><rect x="182" y="73" width="145" height="42" fill="#dceaf1"/><path d="M650 125 560 370M650 125 790 370M710 125 620 400M710 125 850 400M770 125 680 430M770 125 910 430"/><path d="M650 125h170m-13-8 13 8-13 8"/><path d="M560 370h230M620 400h230M680 430h230" stroke="#d78446" stroke-width="9"/><path d="M618 95h65M678 65h65M738 35h65" stroke="#348494" stroke-width="8"/></g><g font-size="21"><text x="160" y="160">一个曝光时刻 t</text><text x="105" y="290">同一投影中心覆盖二维面</text><text x="535" y="200">t₁ → t₂ → t₃，平台持续运动</text><text x="535" y="240">一时刻获得一行</text><text x="535" y="275">不同扫描行对应不同摄站姿态</text></g><text x="35" y="455" font-size="17">示意未按比例；前后视线阵用于同一物点的多角度观测，不是整幅同一中心。</text></g></svg>
