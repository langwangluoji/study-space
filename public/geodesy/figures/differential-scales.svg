法线方向变化。</text><rect x="510" y="65" width="470" height="490" rx="12" fill="#fff" stroke="#d5dfe6"/><text x="530" y="96" fill="#24384b" font-size="21">② 经度：沿纬圈转过 dL</text><circle cx="703" cy="308" r="127" fill="none" stroke="#667b8e" stroke-width="2"/><path d="M703,308 L830,308" fill="none" stroke="#ad6419" stroke-width="2.8" marker-end="url(#orange)"/><path d="M703,308 L807.032309624702,235.15579258341717" fill="none" stroke="#ad6419" stroke-width="2.8" marker-end="url(#orange)"/><path d="M754,308 L753.9894276023548,306.96160085505744 L753.9577147927757,305.9236322343766 L753.9048747195152,304.8865244837223 L753.8309292902698,303.8507075919392 L753.7359091630976,302.81661101267713 L753.6198537337074,301.7846634863375 L753.4828111191244,300.7552928623163 L753.3248381377415,299.72892592161605 L753.1460002857617,298.7059881999005 L752.9463717100431,297.6869038110661 L752.7260351773577,296.6720952714027 L752.4850820400758,295.66198332441695 L752.2236121982907,294.6569867663899 L751.9417340583998,293.6575222727428 L751.6395644881595,292.66400422528204 L751.3172287682308,291.6768445403944 L750.9748605402373,290.6964524982654 L750.6126017513573,289.7232345731897 L750.230602595472,288.7575942650458 L749.829021450894,287.799931932003 L749.4080248147037,286.8506446245318 L748.9677872337186,285.9101259207849 L748.5084912321254,284.97876576341827 L748.0303272358053,284.05695029791957 L747.533493493382,283.14506171251065 L747.0181959940277,282.2434780796908 L746.4846483820587,281.3525731994866 L745.9330718683582,280.47271644447284 L745.3636951386607,279.6042726066293 L744.7767542587386,278.7476017460967" fill="none" stroke="#ad6419" stroke-width="2"/><text x="753" y="287" fill="#ad6419" font-size="19">dL</text><text x="569" y="145" fill="#216aa5" font-size="19">纬圈半径 p = (N + h) cos B</text><text x="535" y="466" fill="#ad6419" font-size="22">东向长度 ≈ p dL</text><text x="535" y="505" fill="#216aa5" font-size="20">高度：上向长度 = dh。</text><text x="28" y="597" fill="#667b8e" font-size="17">