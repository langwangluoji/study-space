<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img" aria-labelledby="title desc">
<title id="title">侧视几何、往返传播与地距投影</title><desc id="desc">平台位于水平地面上方，入射角从竖直法线量起，单程斜距R对应往返延迟2R除以c。小距离变化满足dR等于sinθ乘以dx。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#345b7d"/></marker></defs>
<rect width="1100" height="710" rx="18" fill="#f7fafc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#19364e">
<text x="45" y="49" font-size="27" font-weight="bold">先量斜距，再把距离投影到地面</text>
<rect x="42" y="72" width="1016" height="397" rx="14" fill="#fff" stroke="#c4d4df"/>
<path d="M98 393 H997" stroke="#708b79" stroke-width="4"/>
<rect x="98" y="395" width="899" height="28" fill="#e8eee8"/>
<path d="M245 118 V393" stroke="#8ca5b6" stroke-width="2" stroke-dasharray="7 7"/>
<path d="M245 118 L688 393" stroke="#1769a0" stroke-width="4"/>
<circle cx="245" cy="118" r="10" fill="#1769a0"/>
<circle cx="688" cy="393" r="7" fill="#b55a28"/>
<path d="M245 194 A76 76 0 0 0 310 158" stroke="#b55a28" stroke-width="3" fill="none"/>
<text x="265" y="218" font-size="24" fill="#b55a28">θ</text>
<text x="119" y="101" font-size="22">雷达平台</text>
<text x="161" y="275" font-size="23">高度 H</text>
<text x="434" y="229" font-size="24">单程斜距 R</text>
<text x="712" y="399" font-size="22">目标</text>
<text x="213" y="452" font-size="21">底点</text>
<path d="M262 432 H667" stroke="#345b7d" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="386" y="461" font-size="21">地距 x</text>
<rect x="709" y="105" width="311" height="227" rx="10" fill="#edf4f9"/>
<text x="731" y="141" font-size="21" font-weight="bold">入射角从竖直方向量</text>
<text x="731" y="183" font-size="22">R² = H² + x²</text>
<text x="731" y="223" font-size="22">dR/dx = x/R = sinθ</text>
<text x="731" y="263" font-size="22">δx ≈ δR / sinθ</text>
<text x="731" y="307" font-size="18">平地、小范围的一阶关系</text>
<text x="59" y="513" font-size="23" font-weight="bold">发射与回波之间的延迟是双程传播</text>
<path d="M129 588 H970" stroke="#345b7d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M187 584 V548 M786 584 V548" stroke="#1769a0" stroke-width="3"/>
<text x="147" y="624" font-size="22">发射</text><text x="744" y="624" font-size="22">收到回波</text>
<path d="M200 549 H770" stroke="#345b7d" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="398" y="573" font-size="23">Δt = 2R/c</text>
<text x="946" y="624" font-size="21">时间</text>
<text x="314" y="674" font-size="25" font-weight="bold">单程斜距：R = cΔt / 2</text>
</g></svg>
