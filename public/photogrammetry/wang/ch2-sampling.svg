<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460"><rect width="1000" height="460" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17314a"><text x="35" y="45" font-size="25">把传感器选择拆成不同问题</text><g fill="white" stroke="#7798ae" stroke-width="2"><rect x="35" y="90" width="445" height="130" rx="10"/><rect x="520" y="90" width="445" height="130" rx="10"/><rect x="35" y="250" width="445" height="130" rx="10"/><rect x="520" y="250" width="445" height="130" rx="10"/></g><g font-size="22"><text x="55" y="126">空间 Spatial</text><text x="540" y="126">光谱 Spectral</text><text x="55" y="286">时间 Temporal</text><text x="540" y="286">辐射 Radiometric</text></g><g font-size="19"><text x="55" y="167">一个像元覆盖多大地面？</text><text x="55" y="199">GSD、细节、覆盖与数据量</text><text x="540" y="167">记录哪些波段、带宽多窄？</text><text x="540" y="199">全色 / RGB / NIR / 热红外</text><text x="55" y="327">何时再次看见目标？</text><text x="55" y="359">重访 ≠ 当天必有无云有效影像</text><text x="540" y="327">能区分多细的信号强度变化？</text><text x="540" y="359">位深、噪声、饱和与检校</text></g><text x="35" y="430" font-size="20">定位精度 Accuracy 还依赖摄影几何、姿态、检校、控制与解算。</text></g></svg>
