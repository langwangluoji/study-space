<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img"><title>多层感知机：节点、连接与矩阵对应</title><style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#20324a;font-size:18px}.muted{fill:#60738a;font-size:15px}.axis{stroke:#8a9cb0;stroke-width:1.3}.curve{fill:none;stroke:#147cb1;stroke-width:3}.node{fill:#eef7fc;stroke:#147cb1;stroke-width:2}.edge{stroke:#96aec0;stroke-width:1.5}.accent{fill:#b36b0d}</style><rect width="100%" height="100%" fill="#fff"/><text x="28" y="32" font-weight="bold">多层感知机：节点、连接与矩阵对应</text><line class="edge" x1="144" y1="150" x2="416" y2="125"/><line class="edge" x1="144" y1="150" x2="416" y2="200"/><line class="edge" x1="144" y1="150" x2="416" y2="275"/><line class="edge" x1="144" y1="250" x2="416" y2="125"/><line class="edge" x1="144" y1="250" x2="416" y2="200"/><line class="edge" x1="144" y1="250" x2="416" y2="275"/><line class="edge" x1="464" y1="125" x2="736" y2="165"/><line class="edge" x1="464" y1="125" x2="736" y2="245"/><line class="edge" x1="464" y1="200" x2="736" y2="165"/><line class="edge" x1="464" y1="200" x2="736" y2="245"/><line class="edge" x1="464" y1="275" x2="736" y2="165"/><line class="edge" x1="464" y1="275" x2="736" y2="245"/><circle class="node" cx="120" cy="150" r="24"/><text x="120" y="156" class="" text-anchor="middle">x₁</text><circle class="node" cx="120" cy="250" r="24"/><text x="120" y="256" class="" text-anchor="middle">x₂</text><circle class="node" cx="440" cy="125" r="24"/><text x="440" y="131" class="" text-anchor="middle">z₁</text><circle class="node" cx="440" cy="200" r="24"/><text x="440" y="206" class="" text-anchor="middle">z₂</text><circle class="node" cx="440" cy="275" r="24"/><text x="440" y="281" class="" text-anchor="middle">z₃</text><circle class="node" cx="760" cy="165" r="24"/><text x="760" y="171" class="" text-anchor="middle">y₁</text><circle class="node" cx="760" cy="245" r="24"/><text x="760" y="251" class="" text-anchor="middle">y₂</text><text x="120" y="70" class="" text-anchor="middle">输入 x ∈ ℝ²</text><text x="440" y="70" class="" text-anchor="middle">隐藏层 h(a¹)</text><text x="760" y="70" class="" text-anchor="middle">输出 任务匹配激活</text><text x="270" y="110" class="muted" text-anchor="middle">W¹ 3×2</text><text x="605" y="110" class="muted" text-anchor="middle">W² 2×3</text><text x="440" y="325" class="muted" text-anchor="middle">a¹=W¹x+b¹；z=h(a¹)</text><text x="760" y="325" class="muted" text-anchor="middle">a²=W²z+b²</text><text x="450" y="365" class="muted" text-anchor="middle">偏置直接加入各层加权和；图中连线表示可学习的连接权重。</text><text x="450" y="400" class="muted" text-anchor="middle">本图2→3→2用于维度说明；C4手算使用2→2→2，不能混用其矩阵。</text></svg>