<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470"><rect width="1000" height="470" fill="#f4f7fb"/><g font-family="sans-serif" fill="#172d45"><text x="40" y="48" font-size="26">从对象到可检验的信息 · Object → information</text><g fill="#fff" stroke="#7892ae" stroke-width="2"><rect x="40" y="95" width="190" height="135" rx="12"/><rect x="280" y="95" width="190" height="135" rx="12"/><rect x="520" y="95" width="190" height="135" rx="12"/><rect x="760" y="95" width="200" height="135" rx="12"/></g><g font-size="21"><text x="60" y="133">研究对象</text><text x="60" y="165">地形 / 建筑 / 构件</text><text x="60" y="200" font-size="16">形状、位置、状态</text><text x="300" y="133">影像获取</text><text x="300" y="165">相机 + 平台 + 时刻</text><text x="300" y="200" font-size="16">像素记录，尚非地图</text><text x="540" y="133">量测与处理</text><text x="540" y="165">匹配 / 定向 / 交会</text><text x="540" y="200" font-size="16">几何模型 + 质量检查</text><text x="780" y="133">产品与应用</text><text x="780" y="165">DEM / DOM / DLG</text><text x="780" y="200" font-size="16">坐标、表面、属性</text></g><g stroke="#1e7c9c" stroke-width="4"><path d="M235 160h35m-10-8 10 8-10 8M475 160h35m-10-8 10 8-10 8M715 160h35m-10-8 10 8-10 8" fill="none"/></g><rect x="280" y="300" width="680" height="110" rx="12" fill="#e2eef3"/><text x="305" y="338" font-size="20">地面控制、检查点、传感器检校与应用需求</text><text x="305" y="375" font-size="18">贯穿获取、处理和交付；图像好看 ≠ 坐标准确</text><path d="M380 300V238M620 300V238M860 300V238" stroke="#647f9b" stroke-width="2" stroke-dasharray="6 4"/></g></svg>
