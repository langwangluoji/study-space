<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="t d"><title id="t">Dot product, cross product and scalar triple product</title><desc id="d">Left: projection of a vector onto a unit axis. Right: two vectors span a plane, with a normal and an out-of-plane baseline.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs><rect width="900" height="350" rx="16" fill="#f5f8fa"/><g font-family="Arial,sans-serif" fill="#183d4b"><text x="34" y="36" font-size="21">1. Dot: component along an axis</text><text x="470" y="36" font-size="21">2. Cross: a normal to a plane</text></g><g stroke-width="3" marker-end="url(#arr)"><path d="M55 260H395" stroke="#365e72"/><path d="M55 260 310 92" stroke="#db773e"/></g><path d="M310 92V260" stroke="#7e98a4" stroke-width="2" stroke-dasharray="7 6"/><path d="M292 260v-18h18" fill="none" stroke="#7e98a4"/><path d="M115 260A60 60 0 0 0 105 227" fill="none" stroke="#365e72" stroke-width="2"/><g font-family="Arial,sans-serif" font-size="18" fill="#183d4b"><text x="28" y="284">O</text><text x="345" y="290">unit e</text><text x="202" y="128">v</text><text x="119" y="240">θ</text><text x="105" y="315">v · e = |v| cos θ</text></g><path d="M485 270 700 290 845 204 630 184Z" fill="#d7e9ee" stroke="#7ea4b1" stroke-width="2"/><g fill="none" stroke-width="3" marker-end="url(#arr)"><path d="M555 248 722 264" stroke="#365e72"/><path d="M555 248 678 176" stroke="#365e72"/><path d="M555 248V78" stroke="#2d8c76"/><path d="M555 248 772 94" stroke="#db773e"/></g><path d="M772 94V237" stroke="#db773e" stroke-dasharray="6 5" stroke-width="2"/><g font-family="Arial,sans-serif" font-size="18" fill="#183d4b"><text x="725" y="288">a</text><text x="675" y="171">b</text><text x="568" y="85">n = a × b</text><text x="775" y="89">B</text><text x="785" y="175">height</text><text x="505" y="328">B · (a × b) = signed volume</text></g></svg>
