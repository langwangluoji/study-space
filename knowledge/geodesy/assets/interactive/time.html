step="any" inputmode="decimal" value="-0.2" data-step="0.01" required></label></form><p id="status" role="status" aria-live="polite"></p><dl id="results" aria-live="polite"><div><dt>UTC / 统一参考历元秒数</dt><dd>100.000 s</dd></div><div><dt>TAI / 统一参考历元秒数</dt><dd>137.000 s</dd></div><div><dt>TT / 统一参考历元秒数</dt><dd>169.184 s</dd></div><div><dt>UT1 / 统一参考历元秒数</dt><dd>99.800 s</dd></div></dl><p id="formula">示例 ΔAT 与 DUT1 均为手动输入；TT−TAI 始终为 32.184 s。日期切换及闰秒表查询交由正式时间服务处理。</p></main><script>(()=>{// Pure geodesy teaching models. Angles are degrees; lengths are metres.
const WGS84 = Object.freeze({a: 6378137, f: 1 / 298.257223563});
const rad = degrees => degrees * Math.PI / 180;
const deg = radians => radians * 180 / Math.PI;
const wrap360 = degrees => ((degrees % 360) + 360) % 360;
const wrap180 = degrees => wrap360(degrees + 180) - 180;

function finite(values) {

}

  finite([a, f]);
  if (a <= 0 || f < 0 || f >= 1) throw new RangeError('椭球要求 a > 0，0 ≤ f < 1。');

}

function blhToXyz({B, L, h, a = WGS84.a, f = WGS84.f}) {
  latitude(B, L); finite([h]);
  const {e2} = ellipsoid(a, f), b = rad(B), l = rad(L);

// The geocentre has no unique latitude or longitude. On the polar axis L=0
// is an explicit reporting convention. The inverse teaching domain is
// hypot(X/a,Y/a,Z/b) >= 0.99, including the near surface and exterior.
// Deep points are rejected before iteration because normal coordinates may
// be nonunique there, even when one numerical branch happens to converge.

  if (Math.hypot(p / a, Z / b) < .99) throw new RangeError('反解教学域要求归一化半径 √[(X²+Y²)/a²+Z²/b²] ≥ 0.99；椭球深部可能有多个法线解，请选近地表或外部点。');

function polar(E, N, U) {

  const azimuth = horizontal <= 1e-12 * Math.max(1, range) ? null : wrap360(deg(Math.atan2(E, N)));

function enuFromDelta({B, L, dx, dy, dz}) {

function rotationZ(angle) {
  finite([angle]);
  const c = Math.cos(rad(angle)), s = Math.sin(rad(angle));

function applyMatrix(matrix, vector) {

  const esc = value => String(value).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

  const text = (p, value, color = 'ink', extra = '') => `<text x="${p[0]}" y="${p[1]}" class="${color}" ${extra}>${esc(value)}</text>`;
  const path = (points, color = 'grid', extra = '') => `<path d="${points.map((p, i) => `${i ? 'L' : 'M'}${p[0]},${p[1]}`).join('')}" class="${color}" fill="none" ${extra}/>`;
  const arc = (c, r, start, end, color = 'accent') => path(Array.from({length: 61}, (_, i) => {const a = M.rad(start + (end - start) * i / 60); return [c[0] + r * Math.cos(a), c[1] - r * Math.sin(a)];}), color, 'stroke-width="3"');
  const circle = (c, r, color = 'grid') => `<circle cx="${c[0]}" cy="${c[1]}" r="${r}" class="${color}" fill="none"/>`;
  const metric = (label, value, unit = '') => [label, `${value}${unit ? ` ${unit}` : ''}`];
  const heading = (x, label) => text([x, 38], label, 'ink', 'font-size="17" font-weight="650"');
  const angleTickRing = (c, r) => Array.from({length: 36}, (_, i) => {

  let rows = [], note = '';

  if (mode === 'blh-xyz' || mode === 'inverse') {

    const p3 = inverse ? {X: v.X, Y: v.Y, Z: v.Z} : M.blhToXyz(v);
    const geo = inverse ? M.xyzToBlh(p3) : {...v, longitudeDefined: Math.abs(v.B) !== 90};
    const q3 = M.blhToXyz({...geo, h: 0}), p = Math.hypot(p3.X, p3.Y), q = Math.hypot(q3.X, q3.Y);
