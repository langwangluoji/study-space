<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" role="img" aria-labelledby="t"><title id="t">等效投影面与物理感光面概念区分</title><rect width="940" height="360" rx="16" fill="#f3f7fb"/><g font-family="sans-serif" fill="#193a50" font-size="20"><text x="30" y="36">Coordinate convention ≠ a statement about physical film position</text><path d="M360 70V320" stroke="#9aabba" stroke-dasharray="6 5"/><path d="M360 72L354 86H366Z" fill="#193a50"/><text x="375" y="85">+Z 向上</text><path d="M250 75L530 320" stroke="#176f89" stroke-width="3"/><circle cx="360" cy="171" r="8" fill="#193a50"/><text x="374" y="163">C 摄影中心</text><path d="M200 102H390" stroke="#b77831" stroke-width="4"/><circle cx="281" cy="102" r="6" fill="#b77831"/><text x="450" y="107">物理感光面：光学系统另一侧的示意</text><path d="M270 240H470" stroke="#16847e" stroke-width="4"/><circle cx="439" cy="240" r="6" fill="#16847e"/><text x="495" y="238">所选等效投影面 z = −f</text><text x="495" y="270">a = (x, y, −f)，本例朝向物方</text><circle cx="530" cy="320" r="7" fill="#176f89"/><text x="550" y="326">物点 P，Z &lt; Zs</text><text x="30" y="345">a 与 −a 可表达同一直线；可见方向与参数符号需另行约定。图非按比例。</text></g></svg>
