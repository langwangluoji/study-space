name: Build, verify and publish notes
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: notes-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check
      - run: node scripts/verify-materials.mjs
      - run: pip install -r requirements-geodesy.txt
      - run: python scripts/verify_geodesy.py
      - run: pip install -r requirements-checks.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python scripts/verify_insar.py
      - run: npm run check:math
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-ui.cjs
      - run: node scripts/check-insar-ui.cjs
      - run: node scripts/check-materials-ui.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: notes-preview
          include-hidden-files: true
          path: |
            docs/.vitepress/dist
            reports
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: notes-preview
          path: build-preview
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build-preview/docs/.vitepress/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
